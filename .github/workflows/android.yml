name: Build Android (debug APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Lần đầu: mã nguồn được tải lên dạng gói nén qua giao diện web => giải nén và commit lại
      - name: Giải nén mã nguồn (chỉ lần đầu)
        if: hashFiles('nhip-song.zip') != ''
        run: |
          unzip -o -q nhip-song.zip
          git rm -q --cached nhip-song.zip && rm nhip-song.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Giải nén mã nguồn Nhịp Sống"
          git push
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Kiểm thử lõi nghiệp vụ (TypeScript)
        run: npm test
      - name: Kiểm thử lõi Sign in with ChatGPT (Java, máy chủ giả)
        run: bash native-tests/run.sh
      - name: Build web
        run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NhipSong-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Cập nhật bản phát hành "latest" (link tải APK trực tiếp)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NhipSong.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NhipSong.apk --target "$GITHUB_SHA" --prerelease --title "Nhịp Sống – bản thử nghiệm mới nhất" --notes "APK debug build tự động từ commit ${GITHUB_SHA::7}."
